<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Action Hub</title>
<link rel="stylesheet" href="hub.css">
<style>
/* Layout, the Triage shell: the sections in a sidebar, then the list pane (summary strip, filter tabs, cards stacked
   newest-open first), then a detail pane whenever one is open. At phone width a tab bar along the bottom takes the
   sidebar's place, and an open detail pane takes the list's.
   Nothing here is loaded from the network. Every colour, font and corner is a token of hub.css (light and dark). */
[hidden]{display:none !important}
.wrap{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.wrap:has(> #pane-detail:not([hidden])){grid-template-columns:var(--side-w) minmax(320px,440px) minmax(0,1fr)}
.side{background:var(--side);border-right:1px solid var(--line);padding:18px 10px;position:sticky;top:0;height:100vh;box-sizing:border-box;overflow-y:auto}
.listpane{width:100%;max-width:760px;margin:0 auto;box-sizing:border-box;padding-inline:16px;padding-block:24px 64px;display:grid;gap:18px;align-content:start}
.detailpane{background:var(--surface);border-left:1px solid var(--line);padding:24px;min-width:0;position:sticky;top:0;height:100vh;box-sizing:border-box;overflow-y:auto}
.tabbar{display:none}
.tb{font:500 .72rem var(--f-body);background:none;border:0;color:var(--muted);padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;min-height:44px;justify-content:center;text-align:center;text-decoration:none}
.tb[aria-selected="true"]{color:var(--accent);font-weight:700}
.tb .n{font:600 .68rem var(--f-mono);font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 6px}
.tb .n.hot{background:var(--warn-soft);color:var(--warn)}
.tb:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#list article:focus{outline:none}
#list article:focus-visible{outline:2px dashed var(--accent);outline-offset:2px}
#list article.row[role="button"]{cursor:pointer}
#list article.row{min-height:44px;box-sizing:border-box}
#list article.row[role="button"]:hover{border-color:var(--muted)}
/* Above a phone's width the page itself does not scroll: the shell fills the window and the list and the detail
   pane each scroll on their own, each with its scrollbar at its own right edge. The list's content keeps its
   760px column through its padding, so its scrollbar is at the pane's edge and not beside the column. */
@media (min-width:761px){
  body{overflow:hidden}
  .wrap{height:100vh;height:100dvh;min-height:0;grid-template-rows:minmax(0,1fr)}
  .side,.detailpane{position:static;height:auto;min-height:0}
  .listpane{max-width:none;margin:0;padding-inline:max(16px,calc((100% - 760px) / 2 + 16px));min-height:0;overflow-y:auto}
}
/* The reader holds the window: nothing under it scrolls (openDoc puts .reading on the body, closeDoc takes it off). */
body.reading{overflow:hidden}
.pill{display:none;margin:0;font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
@media (max-width:760px){
  .wrap,.wrap:has(> #pane-detail:not([hidden])){grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .listpane{padding-block:16px 88px}
  .wrap:has(> #pane-detail:not([hidden])) > .listpane{display:none}
  .detailpane{position:static;height:auto;border-left:0;padding:16px 16px 88px}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:4px 0 calc(6px + env(safe-area-inset-bottom))}
  .pill{display:inline-block}
}
/* Between a phone and a wide window the detail pane stacks under the list instead of squeezing beside it. */
@media (min-width:761px) and (max-width:1100px){
  .wrap,.wrap:has(> #pane-detail:not([hidden])){grid-template-columns:var(--side-w) minmax(0,1fr)}
  .wrap:has(> #pane-detail:not([hidden])){grid-template-rows:minmax(0,2fr) minmax(0,3fr)}
  .side{grid-column:1;grid-row:1 / -1}
  .listpane,.detailpane{grid-column:2}
  .detailpane{border-left:0;border-top:1px solid var(--line)}
}
h1{font-size:1.75rem;line-height:1.25;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.links{margin:0;font-size:.9rem}.links a{color:var(--accent)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font:600 .8125rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 12px;border-radius:var(--r-s);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tab .n{font:600 .75rem var(--f-mono);font-variant-numeric:tabular-nums;opacity:.85}
.sw{gap:0;align-items:baseline}
.sw .tab{display:inline;border:0;border-radius:0;background:none;padding:2px 0;font-weight:500;color:var(--muted)}
.sw .tab[aria-selected="true"]{background:none;color:var(--fg);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.sw .tab .n{margin-left:5px}
.sw .tab+.tab::before{content:"\00b7";display:inline-block;margin:0 8px;color:var(--muted)}
.tab:focus-visible,button:focus-visible,textarea:focus-visible,label.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
select{font:500 .8125rem var(--f-body);padding:5px 8px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);color:var(--fg)}
input[type=search]{font:500 .8125rem var(--f-body);padding:5px 10px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.list{display:grid;gap:14px}
.listpane>*,.list>*{min-width:0}
.usage{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.acct{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.acct h3{margin:0;font:600 1rem var(--f-body);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.meter{display:grid;gap:4px}
.meter .lab{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.meter .pct{font:600 .9rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.meter .track{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.meter .fill{height:100%;border-radius:999px;background:var(--accent)}
.meter.high .fill{background:var(--rec)} .meter.high .pct{color:var(--rec)}
.meter.crit .fill{background:var(--warn)} .meter.crit .pct{color:var(--warn)}
.acct .foot{font-size:.75rem;color:var(--muted)}
.acct .foot.stale{color:var(--rec)}
.meter.stale .fill{opacity:.45}
.bfil{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
.bfil .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bfil .lbl{font:600 .7rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:4.5em}
.fchip{font:500 .8125rem var(--f-body);padding:3px 10px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.fchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.fchip .c{opacity:.75;margin-left:4px}
.bfil input[type=search]{font:500 .8125rem var(--f-body);padding:6px 10px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%;max-width:28rem;box-sizing:border-box}
.period{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px;font-size:.85rem;color:var(--muted)}
.agt .pr{font:600 .8rem var(--f-mono);white-space:nowrap}
h3.blk{font:600 .78rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.unote{font-size:.8rem;color:var(--muted);margin:0 0 4px}
.agwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.agt{width:100%;border-collapse:collapse;font-size:.875rem}
.agt th{text-align:left;font:600 .72rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line)}
.agt td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.agt tr:last-child td{border-bottom:0}
.agt .nm{font:600 .875rem var(--f-mono);white-space:nowrap}
.agt .md{font:500 .8rem var(--f-mono);white-space:nowrap}
.agt .role{color:var(--muted);min-width:220px;overflow-wrap:anywhere}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.q.answered{border-left:4px solid var(--accent)}
.q.logged{border-left:4px solid var(--ok);opacity:.92}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8125rem;color:var(--muted)}
.id{font:600 .75rem var(--f-mono);color:var(--fg)}
.chip{font:600 .75rem/1.5 var(--f-body);padding:1px 8px;border-radius:var(--r-s);background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.rec{background:var(--rec-soft);color:var(--rec)}
.q h2{font-size:1.08rem;margin:0;line-height:1.35;text-wrap:balance;overflow-wrap:anywhere}
.rfacts .scope{margin:2px 0 6px;padding-left:20px;overflow-wrap:anywhere}
.rfacts .rbody{font:inherit;margin:2px 0 6px}
.rfacts .full{overflow-wrap:anywhere}
.ctx{margin:0;white-space:pre-wrap;color:var(--fg);max-width:68ch;overflow-wrap:anywhere}
.refs{font:.78rem var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
label.opt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:12px 14px;min-height:44px;box-sizing:border-box;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;align-items:start}
label.opt:hover{border-color:var(--muted)}
label.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
label.opt input{margin-top:4px;accent-color:var(--accent)}
.ol{font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.od{grid-column:2;color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
textarea{width:100%;box-sizing:border-box;min-height:64px;font:inherit;padding:8px 10px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--bg);color:var(--fg);resize:vertical}
.act{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
textarea.ske{min-height:24em;font-family:var(--f-mono);font-size:.85rem}
.ske-row{border-top:1px solid var(--line);padding:6px 0}
.keys{margin-left:auto;font-size:.78rem;color:var(--muted)}
.keys kbd{font:600 .72rem var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--surface)}
@media (max-width:760px){.keys{display:none}}
button.primary{font:600 .875rem var(--f-body);background:var(--accent);color:var(--surface);border:0;border-radius:var(--r-s);padding:8px 16px;min-height:36px;cursor:pointer}
button.link{font:500 .85rem var(--f-body);background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;text-decoration:underline}
button:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
button.link:disabled{background:none;text-decoration:none}
.status{font-size:.82rem;color:var(--muted)}
.status.err{color:var(--warn)}
.ans{background:var(--bg);border-radius:var(--r-s);padding:10px 12px;display:grid;gap:4px}
.ans b{font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.sections{display:flex;flex-direction:column;gap:2px}
.sechead{font:600 .7rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.sec{font:500 .875rem var(--f-body);background:none;border:0;border-radius:var(--r-s);color:var(--fg);padding:7px 10px;min-height:36px;cursor:pointer;display:flex;gap:6px;align-items:center;text-align:left;width:100%;box-sizing:border-box;text-decoration:none}
.sec>.n:first-of-type{margin-left:auto}
.sec:hover{background:var(--hover)}
.sec[aria-selected="true"]{color:var(--fg);font-weight:600;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.sec .n{font:500 .75rem var(--f-mono);font-variant-numeric:tabular-nums;background:none;color:var(--muted);border-radius:var(--r-s);padding:1px 6px}
.sidefoot{margin-top:18px;padding:8px 10px;font-size:.75rem;color:var(--muted);overflow-wrap:anywhere}
.sidefoot>*{display:block;margin:0 0 4px}
.morerow{font:600 .9375rem var(--f-body);display:flex;gap:8px;align-items:center;width:100%;box-sizing:border-box;text-align:left;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-height:44px;cursor:pointer}
.morerow>.n{margin-left:auto;font:600 .75rem var(--f-mono);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 7px}
.morerow>.n.hot{background:var(--warn-soft);color:var(--warn)}
.machine{margin:0}
.home-title{margin:0 0 8px;font-size:1.25rem}
#machine a{display:block;color:inherit;text-decoration:none}
.sec:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.t{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;min-width:0}
.t.done{opacity:.72}
.t.done h2{text-decoration:line-through;text-decoration-color:var(--muted)}
.t > .body{display:grid;gap:8px;min-width:0}
.t h2{font-size:1rem;margin:0;line-height:1.4;text-wrap:balance}
.chk{width:22px;height:22px;margin-top:2px;accent-color:var(--ok);cursor:pointer}
.cmd{display:flex;gap:8px;align-items:stretch;min-width:0}
.cmd pre{margin:0;flex:1;min-width:0;overflow-x:auto;font:.8rem/1.5 var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;white-space:pre}
.cmd pre.diff{max-height:60vh;overflow:auto}
.copy{font:600 .78rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:var(--r-s);padding:0 10px;cursor:pointer}
form.add{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
form.add input[type=text]{font:inherit;padding:8px 10px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
form.add textarea{min-height:44px}
.chip.urgent{background:var(--warn-soft);color:var(--warn)}
.chip.st-late,.chip.st-stopped{background:var(--rec-soft);color:var(--rec)}
/* Status is a glyph plus a word: the word is the element's text, the glyph is drawn here (in the page, since hub.css holds no escapes) and given empty
   alternative text (the second content form), so a screen reader reads the word once. */
.st-done::before,.st-failed::before,.st-stopped::before,.st-late::before,.st-urgent::before{display:inline-block;margin-right:4px;font-weight:700}
.st-done::before{content:"\2713";content:"\2713" / ""}
.st-failed::before{content:"\2715";content:"\2715" / ""}
.st-stopped::before{content:"\25A0";content:"\25A0" / ""}
.st-late::before{content:"\25B2";content:"\25B2" / ""}
.st-urgent::before{content:"\26A0\FE0E";content:"\26A0\FE0E" / ""}
.q.urgent:not(.logged):not(.done),.t.urgent:not(.done){border-left:4px solid var(--warn)}
.sec .n.hot{background:var(--warn-soft);color:var(--warn)}
.urg{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);cursor:pointer}
.urg input{accent-color:var(--warn)}
.chip.need{background:var(--warn-soft);color:var(--warn)}
.flow{display:flex;flex-wrap:wrap;gap:4px;font:500 .74rem var(--f-mono);color:var(--muted)}
.flow span{padding:2px 8px;border-radius:var(--r-s);border:1px solid var(--line)}
.flow span.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.flow span.past{color:var(--fg)}
.links{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
form.add select{font:inherit;padding:8px 10px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.rec input[type=text],.rec textarea,.rec select{font:inherit;padding:8px 10px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.rec textarea{min-height:110px;font-family:var(--f-mono)}
.rec .kv{margin:0;overflow-wrap:anywhere}
.rec .kv b{font:500 .85rem var(--f-mono)}
.q.unread{border-left:4px solid var(--accent)}
.quote{margin:0;padding-left:10px;border-left:3px solid var(--line);color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch}
.reply{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch}
.gone{background:var(--rec-soft);color:var(--rec);border-radius:var(--r-s);padding:8px 12px;font-size:.85rem;margin:0;overflow-wrap:anywhere}
.pk h2{margin:0;font-size:1rem;line-height:1.4}
.pk-h{font:600 .78rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.pk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:grid;gap:6px;min-width:0}
.pk .age{font:600 .8rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.pk .age.old{color:var(--rec)}
.pk .br{font:.78rem var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.fchip[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pmf{display:grid;gap:8px;min-width:0}
.pmf .row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.pmbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.q.row{gap:8px}
.row[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.row h2{font-size:1rem}
.dview{display:grid;gap:14px;align-content:start}
fieldset.days{display:flex;flex-wrap:wrap;gap:6px}
.sched .fld{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.segc{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;width:max-content}
.segc button{font:inherit;padding:6px 14px;border:0;border-radius:0;background:var(--bg);color:var(--fg);cursor:pointer}
.segc button[aria-checked=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
button.daychip{font:inherit;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
button.daychip[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
button.daychip[aria-pressed=true]::before{content:"\2713\00a0"}
.lock{font-size:.8rem}
.row.muted{opacity:.62}
.row.pc{cursor:default}
.sched input[type=time]{font:inherit;padding:6px 8px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--bg);color:var(--fg);width:max-content}
.q.queued{border-left:4px solid var(--line)}
.q.sent{border-left:4px solid var(--accent)}
.q.done{border-left:4px solid var(--ok)}
button.danger{color:var(--warn)}
.empty strong{display:block;color:var(--fg);font-size:1rem;margin-bottom:4px}
.reader{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.reader .rbar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.reader h2{margin:0;font-size:1rem;line-height:1.35;overflow-wrap:anywhere;min-width:0}
.reader .rbody{flex:1;min-height:0;overflow:hidden;display:flex}
.docframe{display:block;flex:1;width:100%;height:100%;border:0;background:#fff}
.sch-group{margin:14px 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.sch-line{margin:4px 0;font-size:.85rem;color:var(--muted)}
.sch-prog{display:grid;gap:3px;margin-top:6px}
.sch-prog .track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.sch-prog .fill{height:100%;background:var(--accent)}
.sch-prog .pct{font-size:.75rem;color:var(--muted)}
.boxes{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}

<script>
(function(){
  const $ = s => document.querySelector(s);
  const state = { docs: [], inbox: [], ifilter: "unread", todos: [], stories: [], backlog: [], completed: [], period: 7, bprio: new Set(["1", "2", "3"]), bstat: new Set(["open", "blocked", "parked", "pulled"]), bq: "", idq: "", usage: [], agents: [], skills: [], skilledits: [], landings: [], skEdit: new Map(), notices: [], parked: [], gone: {}, partial: {}, seen: null, repos: [], brepo: "", sfilter: "current", rec: null, infotab: "usage", inboxtab: "questions", afilter: "waiting", lintOpen: null, topm: [], approvals: [], decided: [], strong: false, pages: [], pfilter: "queued", pmOlder: false, pmEdit: new Map(), todoEdit: new Map(), stale: {}, section: "questions", filter: "open", tfilter: "open", repo: "", editing: new Set(), sel: null,
    // The Schedule view: its tab, the History filters, the Week grid's pick and shift, the reserve note and the run asked once.
    sch: { tab: "now", repo: "", kind: "", result: "", histOpen: false, shift: 0, pick: null, note: "", confirm: null, stats: null, days: 7, statsRev: null, statsWhy: "", status: "", bad: false, busy: false,

      hold: null, edit: null, games: null, div: null } };
  // The address's hash names a section (and, for some, the tab inside it): what each route sets in state. The

  const ROUTES = { "#home": {section:"home"}, "#questions": {section:"questions"}, "#inbox": {section:"inbox"}, "#todo": {section:"todo"}, "#topm": {section:"topm"}, "#approvals": {section:"approvals"}, "#more": {section:"more"}, "#schedule": {section:"schedule"},
    "#backlog": {section:"backlog"}, "#stories": {section:"backlog"}, "#parked": {section:"backlog", sfilter:"parked"},
    "#docs": {section:"docs"}, "#autotasks": {section:"autotasks"}, "#findings": {section:"findings"}, "#info": {section:"info"}, "#usage": {section:"info", infotab:"usage"}, "#agents": {section:"agents"}, "#skills": {section:"skills"}, "#landings": {section:"landings"}, "#notices": {section:"info", infotab:"notices"} };
  const route = h => Object.prototype.hasOwnProperty.call(ROUTES, h) ? ROUTES[h] : null;
  try { const it = localStorage.getItem("oq.infotab"); if (it === "usage" || it === "notices") state.infotab = it; } catch(e){}
  Object.assign(state, route(location.hash));
  // ready: the server has answered once, so the lists are real and the owner's controls are shown.
  let ready = false, lastRead = 0;

  // The one transport: every call the page makes to the hub server goes through this object, so another
  // transport (the same four methods) can replace it. The session cookie the pairing link set is the page's
  // only credential; the browser adds Origin to a write. A refusal is an Error with status, code, field and
  // retryAfter (seconds, when the server named one). A call that got no answer at all has status 0 and code
  // "network": so has an answer that said yes and whose body was cut off or timed out. unpaired is true when
  // the server no longer knows this browser: a 403 that names the field `role` (what the server answers a
  // call with no session, a read or a write), any other 403 on a read, or a 401. A 403 on a write that names
  // another field (the Origin rule) is a plain refusal, shown in the server's words, and so is a 403 that names
  // the field `access`: the tunnel listener's refusal of a Cloudflare Access token, which pairing cannot mend.
  // said is the server's own message, kept when the error's message is the pairing line: the decide route's 403
  // for a session that is not strong names the field `role` too, and its card shows the server's words.
  const PAIR_HOW = "On the PC, in the kit folder, run `python tools/hub.py open` and open the link it prints.";
  const PAIR_AGAIN = "this browser is not paired with the hub (yet, or any more: it was unpaired, or its session ran out). " + PAIR_HOW;
  const noAnswer = () => { const err = new Error("the hub server did not answer"); err.status = 0; err.code = "network"; err.field = ""; err.retryAfter = 0; err.unpaired = false; return err; };
  // The hub's routes never redirect, so a redirect is the tunnel's sign-in (Cloudflare Access) sending this page to
  // its login: only a reload of the page signs in again. It is fetched with redirect "manual", so it is told apart from
  // a call that got no answer (a redirect to the login's own site would fail as a network error).
  const SIGNIN_AGAIN = "the tunnel's sign-in has run out or was refused: reload this page to sign in again";
  const signIn = () => { const err = noAnswer(); err.message = SIGNIN_AGAIN; err.code = "signin"; return err; };
  const hub = {
    base: "/api/v1",
    // stop, when given, is a signal that ends the call early too (the watch loop's nudge); it fails as no answer.
    async call(method, path, body, ms, stop){
      // A controller and a timer end a call that says nothing; older browsers have no timeout signal of their own.
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), ms || 30000);
      if (stop) { if (stop.aborted) ac.abort(); else stop.addEventListener("abort", () => ac.abort()); }
      const init = { method, credentials: "same-origin", cache: "no-store", redirect: "manual", headers: { Accept: "application/json", "X-Hub-Via": "web" }, signal: ac.signal };
      if (method !== "GET") { init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(body || {}); }
      let r, j = null;
      try {
        r = await fetch(this.base + path, init);
        if (r.type === "opaqueredirect") throw signIn();
        try { j = await r.json(); } catch (e) {}
      } catch (e) { throw e && e.code === "signin" ? e : noAnswer(); }
      finally { clearTimeout(timer); }
      if (r.ok && !j) throw noAnswer();
      if (r.ok && j.ok !== false) return j;
      const er = (j && j.error) || {};
      const unpaired = r.status === 401 || (r.status === 403 && er.field !== "access" && (method === "GET" || er.field === "role"));
      const err = new Error(unpaired ? PAIR_AGAIN : er.message || "the hub server answered " + r.status);
      err.status = r.status; err.code = er.code || ""; err.field = er.field || ""; err.retryAfter = Number(r.headers.get("Retry-After")) || 0; err.unpaired = unpaired; err.said = er.message || "";
      err.id = er.id != null ? String(er.id) : "";                // a refusal that names its document (a schedule's 409)
      throw err;
    },
    snapshot(){ return this.call("GET", "/snapshot"); },
    // The server answers a wait within about 55 s; the page gives up on one that says nothing for 90 s.
    wait(since, stop){ return this.call("GET", "/wait?since=" + encodeURIComponent(String(since)), null, 90000, stop); },
    post(path, body){ return this.call("POST", path, body); }
  };
  const seg = id => encodeURIComponent(String(id));
  // One write, then the lists are read again, so the page shows what the server holds and not a guess.
  async function write(path, body){ const r = await hub.post(path, body); await refresh().catch(() => {}); return r; }
  // A write the owner repeats at once (a tick, a flag, a read mark): the caller has already painted the new state, the
  // POST goes out without waiting for the lists to be read again (the watch loop reconciles), and a failure of any kind
  // (a 409 too) puts the old paint back through `undo` and says "Not saved" in `say`, so a real failure stays in sight.
  // Two of them can be in flight at once; each undoes only its own paint, and the read after a failure shows what the
  // server holds. The returned promise ends when the POST has answered.
  function writeQuick(path, body, undo, say){
    return hub.post(path, body).then(() => { refresh().catch(() => {}); }, e => {
      undo(); say.className = "status err"; say.textContent = "Not saved: " + why(e) + ".";
      refresh().catch(() => {});
    });
  }
  const why = e => (e && e.message) || "the hub server refused the write";
  const NOT_READY = "Waiting for the hub server", NOT_READY_WHY = "Nothing has been read from the hub server yet. The line at the top says why when it cannot be reached.";

  try { const f = localStorage.getItem("oq.filter"); if (f) state.filter = f; const sct = localStorage.getItem("oq.section"); if (sct && !["#home", "#inbox", "#todo", "#questions", "#backlog", "#stories", "#usage", "#info", "#agents", "#skills", "#parked", "#topm", "#docs", "#autotasks", "#findings", "#approvals", "#more", "#schedule"].includes(location.hash)) { state.section = {stories: "backlog", parked: "backlog", usage: "info", pages: "docs"}[sct] || sct; if (sct === "parked") state.sfilter = "parked"; } const sf = localStorage.getItem("oq.sfilter"); if (["current", "parked", "done"].includes(sf) && location.hash !== "#parked") state.sfilter = sf; state.brepo = localStorage.getItem("oq.brepo") || ""; const pd = +localStorage.getItem("oq.period"); if ([1, 7, 30, 90].includes(pd)) state.period = pd; for (const [k, v] of [["bprio", "oq.bprio"], ["bstat", "oq.bstat"]]) { const x = JSON.parse(localStorage.getItem(v) || "null"); if (Array.isArray(x)) state[k] = new Set(x.map(String)); } } catch(e){}
  // An answer's draft is kept in the browser's storage and in the page itself, so it survives a redraw
  // where the browser gives the page no storage.
  const draftKey = id => "oq.draft." + id, drafts = new Map();
  const readDraft = id => { if (drafts.has(id)) return drafts.get(id); try { return JSON.parse(localStorage.getItem(draftKey(id)) || "null"); } catch(e){ return null; } };
  const saveDraft = (id, d) => { drafts.set(id, d); try { localStorage.setItem(draftKey(id), JSON.stringify(d)); } catch(e){} };
  const clearDraft = id => { drafts.delete(id); try { localStorage.removeItem(draftKey(id)); } catch(e){} };
  // What a card has to say that must outlast a redraw (its question changed on the server), by id.
  const said = new Map();
  // Two things a card may know that the lists do not yet, each held by id with the question as the page
  // held it then (asIs): an answer that was sent and not read back (sent), and a refusal for a changed
  // question that could not be read again (unread). Each ends once the lists hold the question otherwise.
  const sent = new Map(), unread = new Map();
  const asIs = d => JSON.stringify([d.version, d.status, d.answer || null]);
  const CHANGED = "Not sent: this question changed on the hub server while you were answering. Your draft is kept; check it against the question as it is now, then send again.";
  const CHANGED_UNREAD = "Not sent: this question changed on the hub server and could not be read again, so this card still shows it as it was. Your draft is kept; send again once the page has read the hub server.";
  const SENT_UNREAD = "Your answer was sent. The hub server could not be read again, so this card still shows the question as it was before your answer; it shows the answer once the server is read.";

  function el(tag, attrs, ...kids){
    const n = document.createElement(tag);
    for (const [k,v] of Object.entries(attrs||{})) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null) n.append(c);
    return n;
  }

  const lastRunText = s => s.last_run ? when(s.last_run) : s.last_outcome === "failed" ? "failed, the tick could not start it" : s.last_outcome === "skipped" ? "skipped, the tick passed it over" : "never";

      if (keep) parts.push(el("label", {class:"opt", for: name + "-standing"}, keep, el("span", {class:"ol", text:"Make this a standing rule"}), el("span", {class:"od", text:"The PM logs it in the ledger, so the same question is not asked again."})));
      parts.push(acts);
    } else if (sent.has(d.id)) {
      parts.push(el("p", {class:"gone", role:"status", text: SENT_UNREAD}));
    } else if (d.answer) {
      const a = d.answer;
      const pick = a.choice === "other" ? "Something else" : (a.label || opts[a.choice]?.label || "—");
      parts.push(el("div", {class:"ans"},
        el("div", {}, el("b", {text: "Your answer: "}), pick, a.choice === rec ? " (the recommendation)" : ""),
        a.note ? el("div", {text: a.note}) : null,
        el("div", {class:"status", text: (a.at ? "Submitted " + when(a.at) : "") + (d.status === "logged" ? " · logged" : hubDone(d) ? " · filed in " + (d.record && typeof d.record.id === "string" ? d.record.id : "its record") + " · done by the hub once " + filedFor(d) + " had it" : d.status === "done" ? " · done, no ruling needed" : d.status === "filed" ? " · filed in " + (d.record && typeof d.record.id === "string" ? d.record.id : "its record") + " · waiting for " + filedFor(d) + " to read it" : qBound(d) ? " · waiting to be filed in " + (typeof d.record.id === "string" ? d.record.id : "its record") : " · waiting for the PM to log it") + (qBound(d) && d.standing ? " · a standing rule, for the PM to log" : "")})
      ));
      if (canPromote(d)) {
        // A filed answer made a standing rule afterwards: the answer route with standing and no choice.
        const st = el("span", {class:"status", role:"status"});
        const go = el("button", {class:"link", type:"button", text:"Make it a standing rule"});
        go.addEventListener("click", async () => {
          go.disabled = true; st.className = "status"; st.textContent = "Sending…";
          try { await hub.post("/questions/" + seg(d.id) + "/answer", { standing: true, ...pin(d) }); await refresh().catch(() => {}); render(); }
          catch (e) { st.className = "status err"; st.textContent = "Not sent: " + why(e) + "."; go.disabled = false; }
        });
        parts.push(el("div", {class:"act"}, go, st));
      }
      if (reanswerable(d)) parts.push(el("div", {class:"act"}, el("button", {class:"link", type:"button", text:"Change answer", onclick: () => { state.editing.add(d.id); render(); }})));
    }
    return el("article", {class: "q " + d.status + (d.urgent ? " urgent" : ""), id: "q-" + d.id}, ...parts);
  }

  // Docs: the agents' documents (pages/<id>), listed as text like every other card. A body (page_html/<id>) is
  // agent-written html, read from the server (GET /api/v1/pages/<id>) when it is opened: it is shown only in the
  // reader's one frame, made below with a sandbox that grants nothing (no scripts, no forms, no same-origin, no
  // navigation of the page) and a policy in front of the body that blocks its own loads (inline styles and data:
  // images only). A clicked link still navigates the frame itself, outside this policy (the sandbox still holds
  // there); docs/action-hub.md says what that leaves open.
  const DOC_CSP = "<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'\">";
  // A srcdoc document's base URL is the hub page's, so a bare href="#x" is a link to the hub page plus #x: the
  // frame navigated away instead of scrolling (and :target never matched). Spelled about:srcdoc#x it is the
  // frame's own address, so the browser scrolls and sets :target. The sandbox and the policy are untouched.
  const docFragments = html => html.replace(/(<(?:a|area)\b[^<>]*?\shref\s*=\s*["'])#/gi, "$1about:srcdoc#");
  // A card's refs, kept as keptRefs keeps them: a ref that is a listed document's id is a button that opens it
  // in the reader, and any other ref is text. lead goes before them and sep between them.
  function refsLine(refs, lead, sep){
    const kept = keptRefs(refs); if (!kept.length) return null;
    const ids = new Set(state.pages.map(p => p.id)), kids = lead ? [lead] : [];
    const open = r => { const b = el("button", {class:"link", type:"button", text: r, title: "Read document " + r}); b.addEventListener("click", () => openDoc(r, b)); return b; };
    kept.forEach((r, i) => { if (i) kids.push(sep); kids.push(ids.has(r) ? open(r) : r); });
    return el("div", {class:"refs"}, ...kids);
  }
  // docOpen is the id in the reader, docFrom the button that opened it (the focus goes back to it), and docAsk
  // counts the reads, so a body that arrives after its reader was closed or opened on another is dropped.
  let docOpen = null, docFrom = null, docAsk = 0;
  function renderDocs(){
    fillRepos(state.pages);
    const rows = state.pages.filter(p => inR(p) && inId(p));
    if (!rows.length) {
      const msg = ["No documents yet", "An agent's document (a plan, research, a visual choice) shows here once an agent publishes it (hub.py pages publish, or the hub_page_publish tool)."];
      if (ready && (state.idq.trim() || state.repo) && state.pages.length) { msg[0] = state.idq.trim() ? "No match for \"" + state.idq.trim() + "\"" : "No documents for this repo"; msg[1] = "Clear the id box or pick All repos to see every document."; }
      show([], el("div", {class:"empty"}, el("strong", {text: ready ? msg[0] : NOT_READY}), ready ? msg[1] : NOT_READY_WHY));
      return;
    }
    // This week and Earlier, by the document's last change (updated_at, else at); one with no time stated is Earlier.
    const week = Date.now() - 7 * 86400000, recent = p => { const t = new Date(p.updated_at || p.at); return !isNaN(t) && t >= week; };
    const groups = [["This week", rows.filter(recent)], ["Earlier", rows.filter(p => !recent(p))]].filter(g => g[1].length);
    const at = settle(groups.flatMap(g => g[1].map(p => ["doc", p])));
    show([], groups.flatMap(([t, rs]) => [el("h3", {class:"blk", text: t + " · " + rs.length}), ...rs.map(p => drawn(docRow, p))]));
    pickDetail(at);
  }
  const docRow = p => rowCard("doc", p, [p.repo ? el("span", {class:"chip", text: String(p.repo)}) : null, p.from ? el("span", {class:"chip", text: "from " + p.from}) : null],
    p.updated_at || p.at ? when(p.updated_at || p.at) : "");
  // The detail of a document: its summary is the excerpt (the body is read only by Read full screen), its refs, and the
  // buttons. Ask the PM puts a line about the document in the Message the PM form; nothing is sent.
  function docCard(p){
    const head = el("div", {class:"meta"},
      el("span", {class:"id", text: p.id}),
      p.repo ? el("span", {class:"chip", text: p.repo}) : null,
      p.from ? el("span", {text: "from " + p.from}) : null,
      p.updated_at || p.at ? el("span", {text: when(p.updated_at || p.at)}) : null);
    const parts = [head, el("h2", {text: p.title || "(untitled)"})];
    if (p.summary) parts.push(el("p", {class:"ctx", text: p.summary}));
    parts.push(refsLine(p.refs, "Refs: ", ", "));
    // Delete is the owner's (the server takes it from the owner only), asks twice and is pinned to the card's version.
    const st = el("span", {class:"status", role:"status"});
    parts.push(el("div", {class:"act"},
      el("button", {class:"primary", type:"button", id: "dr-" + p.id, text: "Read full screen", onclick: () => openDoc(p.id)}),
      el("button", {class:"link", type:"button", text: "Ask the PM about it", onclick: () => askAbout(p)}),
      delButton("/pages/" + seg(p.id) + "/delete", st, p.version), st));
    return el("article", {class:"q", id: "doc-" + p.id}, ...parts);
  }
  function askAbout(p){
    pmCompose.prefill("About the document " + p.id + (p.title ? " (" + p.title + ")" : "") + ": ", p.repo);
    pickSection("topm");
    $("#pm-add").disabled = !pmCompose.get().text;
    pmCompose.ta.focus();
  }
  const readerSays = (text, bad) => $("#reader-body").replaceChildren(el("p", {class: bad ? "status err" : "status", role:"status", text}));
  async function openDoc(id, from){
    const p = state.pages.find(x => x.id === id), title = (p && p.title) || id, ask = ++docAsk;
    $("#reader-title").textContent = title;
    readerSays("Reading the document from the hub server…");
    $(".wrap").inert = true;
    document.body.classList.add("reading");
    $("#reader").hidden = false;
    docOpen = id; docFrom = from || null;
    $("#reader-close").focus();
    let r;
    try { r = await hub.call("GET", "/pages/" + seg(id)); }
    catch (err) {
      if (ask === docAsk) readerSays(err.status === 404 ? "This document has no body on the hub server." : "Not read: " + why(err) + ".", true);
      return;
    }
    if (ask !== docAsk) return;
    if (typeof r.html !== "string") { readerSays("This document has no body on the hub server.", true); return; }
    const frame = el("iframe", {class:"docframe", sandbox: "", title: "Document: " + title});
    frame.srcdoc = DOC_CSP + docFragments(r.html);
    $("#reader-body").replaceChildren(frame);
  }
  function closeDoc(){
    docAsk++;
    $("#reader").hidden = true;
    $("#reader-body").replaceChildren();
    $(".wrap").inert = false;
    document.body.classList.remove("reading");
    const back = docFrom && docFrom.isConnected ? docFrom : docOpen != null ? document.getElementById("dr-" + docOpen) : null;
    docOpen = null; docFrom = null;
    if (back) back.focus();
  }
  $("#reader-close").addEventListener("click", closeDoc);
  $("#reader").addEventListener("keydown", e => { if (e.key === "Escape") { e.preventDefault(); closeDoc(); } });

  $("#tabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    state.filter = t.dataset.f; try { localStorage.setItem("oq.filter", state.filter); } catch(e){}
    render();
  });
  // The sidebar and the phone's tab bar pick a section the same way.
  function pickSection(s){
    state.sel = null;
    state.section = s === "questions" && (state.section === "questions" || state.section === "inbox") ? state.section : s === "questions" ? state.inboxtab : s;
    try { localStorage.setItem("oq.section", state.section); } catch(e){}
    render();
    const r = state.sel && document.getElementById("row-" + state.sel.id); if (r && r.scrollIntoView) r.scrollIntoView({block: "nearest"});
  }
  $("#sections").addEventListener("click", e => { const b = e.target.closest(".sec"); if (b && b.dataset.s) pickSection(b.dataset.s); });
  $("#tabbar").addEventListener("click", e => { const b = e.target.closest(".tb"); if (b && b.dataset.s) pickSection(b.dataset.s); });
  // J and K move the focus to the next and the previous card of the list. Never while the owner types in a
  // field, with a modifier held, or while the reader is open.
  const FIELD = "input, textarea, select, [contenteditable]:not([contenteditable=false])";
  const inField = n => !!n && typeof n.closest === "function" && (!!n.closest(FIELD) || n.isContentEditable === true);
  document.addEventListener("keydown", e => {
    const k = e.key === "j" || e.key === "J" ? 1 : e.key === "k" || e.key === "K" ? -1 : 0;
    if (!k || e.ctrlKey || e.metaKey || e.altKey || e.defaultPrevented || !$("#reader").hidden) return;
    if (inField(e.target) || inField(document.activeElement)) return;
    const cards = [...document.querySelectorAll("#list article")].filter(c => !c.parentNode.closest("#list article"));
    if (!cards.length) return;
    const at = cards.findIndex(c => c === document.activeElement || c.contains(document.activeElement));
    const n = cards[at < 0 ? 0 : Math.max(0, Math.min(cards.length - 1, at + k))];
    e.preventDefault();
    if (n.getAttribute("tabindex") == null) n.tabIndex = -1;    // a row already in the Tab order stays in it
    n.focus();
    if (n.scrollIntoView) n.scrollIntoView({block: "nearest"});
  });
  // The number keys and Enter act on the open question in the detail pane (its card gave its fieldset pick and send).
  // 1 to 9 pick the option of that number (the one after the last is Something else); Enter sends the answer when the
  // Send button is enabled. Never while the owner types in a text field, a select or a note, with a modifier held, on a
  // button or link (Enter there is theirs), or while the reader is open. A radio (where a click leaves the focus) is
  // not a field for these keys.
  document.addEventListener("keydown", e => {
    const n = /^[1-9]$/.test(e.key) ? +e.key : 0, enter = e.key === "Enter";
    if ((!n && !enter) || e.ctrlKey || e.metaKey || e.altKey || e.defaultPrevented || !$("#reader").hidden) return;
    const fs = $("#pane-detail fieldset");
    if (!fs || !fs.pick) return;
    const radio = t => !!t && typeof t.getAttribute === "function" && t.tagName === "INPUT" && t.getAttribute("type") === "radio";
    for (const t of [e.target, document.activeElement]) if (inField(t) && !radio(t)) return;
    if (enter && ((e.target && typeof e.target.closest === "function" && e.target.closest("button, a, summary")) || fs.send.disabled)) return;
    if (enter) { e.preventDefault(); fs.go(); }
    else if (fs.pick(n)) e.preventDefault();
  });
  $("#qtabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    state.sel = null; state.section = state.inboxtab = t.dataset.qt; try { localStorage.setItem("oq.section", state.section); } catch(err){}
    render();
  });
  $("#ftabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    state.infotab = t.dataset.nf; try { localStorage.setItem("oq.infotab", state.infotab); } catch(err){}
    render();
  });
  $("#itabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    state.ifilter = t.dataset.if; render();
  });
  $("#atabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    state.afilter = t.dataset.af; state.sel = null; render();
  });
  $("#ttabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    state.tfilter = t.dataset.tf; render();
  });
  const addT = $("#add-title"), addD = $("#add-detail"), addB = $("#add-btn"), addS = $("#add-status");
  addT.addEventListener("input", () => { addB.disabled = !addT.value.trim(); });
  $("#addform").addEventListener("submit", async e => {
    e.preventDefault();
    const title = addT.value.trim(); if (!title) return;
    addB.disabled = true; addS.className = "status"; addS.textContent = "Adding…";
    try {
      await write("/todos", { title, detail: addD.value.trim(), urgent: $("#add-urgent").checked });      // the server writes from, status and the time
      addT.value = ""; addD.value = ""; $("#add-urgent").checked = false; addS.textContent = "Added";
    } catch (err) {
      addS.className = "status err"; addS.textContent = "Not added: " + why(err) + ". Try again."; addB.disabled = false;
    }
  });
  $("#stabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    state.sfilter = t.dataset.sf; state.rec = null; try { localStorage.setItem("oq.sfilter", state.sfilter); } catch(err){}
    render();
  });
  $("#brepo").addEventListener("change", e => { state.brepo = e.target.value; try { localStorage.setItem("oq.brepo", state.brepo); } catch(err){} render(); });
  // New story opens a blank record page for the backlog picked at the top (the first one under All).
  $("#rec-new").addEventListener("click", () => { const r = state.brepo || knownRepos()[0]; if (r) openRecord(r, null); });
  $("#repo").addEventListener("change", e => { state.repo = e.target.value; render(); });

  // Loading. One snapshot fills every list. Then one long-poll at a time waits for the next change and the
  // snapshot is read again. A failure is said at the top, in its own words: an unpaired browser is told how to
  // pair and reads again only every HUB_UNPAIRED_MS (a refusal at a server restart heals by itself), a busy
  // server is given the wait it asked for, and anything else is tried again after hubRetryMs.
  let rev = 0, lastKey = "", lastCheap = "", fails = 0;
  function loadSay(text){ const b = $("#loaderr"); b.textContent = text; b.hidden = !text; }
  // The server's own word that hub code newer than it has landed: its restart text (the owner's step), shown until it restarts.
  function codeSay(code){ const b = $("#codeerr"), t = code && code.stale === true && typeof code.restart === "string" ? code.restart : ""; b.textContent = t; b.hidden = !t; }
  const typing = () => { const a = document.activeElement; return !!a && a !== document.body && a.matches("input:not([type=checkbox]):not([type=radio]), textarea"); };
  async function refresh(){
    const next = hubState(await hub.snapshot());
    if (ready && next.revision < rev) return;         // an older answer that arrived late
    codeSay(next.code);
    // The same revision and the same of everything a revision does not cover (the git-backed views: backlogs, usage,
    // agents, repos, notices, what is stale, partial or unavailable) is the page already drawn: only what moves on every
    // read is brought up to date, without the whole-snapshot comparison and the redraw. The lists of the store's own
    // documents are what a revision covers, so they are left out of this cheaper key.
    const untimedRows = rows => rows.map(r => ({ ...r, posted_at: null }));
    const cheap = JSON.stringify([next.revision, next.gone, next.partial, next.stale, next.strong, next.repos, untimedRows(next.backlog), untimedRows(next.completed), next.usage.map(u => ({ ...u, measured_at: null })), next.agents, next.skills, next.notices]);
    if (ready && next.revision === rev && cheap === lastCheap) {
      for (const k of ["seen", "push"]) state[k] = next[k];
      lastRead = Date.now(); seenLine();
      return;
    }
    lastCheap = cheap;
    rev = next.revision;
    const first = !ready; ready = true; lastRead = Date.now();
    for (const k of ["docs", "inbox", "todos", "stories", "topm", "repos", "backlog", "completed", "parked", "usage", "agents", "skills", "skilledits", "landings", "notices", "pages", "gone", "partial", "stale", "seen", "push", "approvals", "decided", "strong"]) state[k] = next[k];
    // An edit outlasts its item: one that is gone, or no longer the owner's to edit, keeps its card (loseEdit).
    for (const id of [...state.pmEdit.keys()]) if (!state.topm.some(x => x.id === id && x.status === "queued")) loseEdit(state.pmEdit, id);
    for (const id of [...state.todoEdit.keys()]) if (!state.todos.some(t => t.id === id && t.from === "you")) loseEdit(state.todoEdit, id);
    // What the lists show, without what moves on every read (the revision, and the time of each read or fetch
    // of a backlog or of the usage): when only those moved and the owner is typing, the lists are left alone.
    const untimed = rows => rows.map(r => ({ ...r, posted_at: null }));
    const unsince = Object.fromEntries(Object.entries(next.stale).map(([v, rows]) => [v, rows.map(o => ({ ...o, since: null }))]));
    const key = JSON.stringify({ ...next, revision: 0, seen: null, push: null, watcher: null, stale: unsince, usage: next.usage.map(u => ({ ...u, measured_at: null })), backlog: untimed(next.backlog), completed: untimed(next.completed), parked: untimed(next.parked) });
    const same = key === lastKey; lastKey = key;
    // A list that cannot be drawn: the counts drawn before it stay, the page is left as ready as it was before
    // this read (not ready on a first read, so its controls stay hidden and the next snapshot is drawn whatever
    // its revision), the next read draws again, and the error goes up to be said at the top.
    try { if (first || !same || !typing()) render(); else seenLine(); }
    catch (e) {
      lastKey = ""; lastCheap = "";
      if (first) { ready = false; try { render(); } catch (e2) {} }
      throw e;
    }
  }
  // The nudge: the tab shown again, the browser back online, or the page restored from the browser's back-forward
  // cache ends what the watch loop is waiting on (its long-poll or its sleep after a failure), and the snapshot is read
  // at once. A phone that slept may hold a long-poll on a connection that is gone, and a run of failures while the tab
  // was hidden may have it sleeping for a minute: either way the owner, back on the page, would see old lists.
  let nudge = null;
  const poke = () => { if (nudge) nudge.abort(); };
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poke(); });
  window.addEventListener("online", poke);
  window.addEventListener("pageshow", e => { if (e && e.persisted) poke(); });
  const nap = (ms, stop) => new Promise(done => { const t = setTimeout(done, ms); stop.addEventListener("abort", () => { clearTimeout(t); done(); }); });
  async function watch(){
    // After a failure the lists are read again before waiting: what was missed is shown, and the notice at
    // the top goes as soon as the server answers, not when the next change comes.
    let again = true;
    for (;;) {
      const stop = nudge = new AbortController();
      let read = false;                                 // the snapshot read just before this wait answered
      try {
        if (again) { await refresh(); again = false; loadSay(""); countFindings(); }    // fails is kept: only a wait that answers ends the run of failures
        read = true;
        const w = await hub.wait(rev, stop.signal);
        if (w.reset) rev = 0;                           // the server's history does not reach back to rev: take whatever it holds now
        await refresh();
        countFindings();
        fails = 0; loadSay("");
      } catch (e) {
        // A nudge ended the wait: read again at once, with no failure counted and nothing said.
        if (stop.signal.aborted && e && e.code === "network") { again = true; continue; }
        const old = ready ? " The lists may be out of date." : "";
        fails++; again = true;
        const signin = !!e && e.code === "signin";
        const ms = hubNextMs(fails, e && e.retryAfter, e && (e.unpaired || signin), read), msg = (e && e.message) || "no reason given";
        loadSay(e && e.unpaired ? "This browser is not paired with the hub (yet, or any more: it was unpaired, or its session ran out). " + PAIR_HOW + " This page reads the hub server again every " + Math.round(ms / 1000) + " s, and carries on by itself once it is paired." + old
          : signin ? "The tunnel's sign-in has run out or was refused: reload this page to sign in again. Until then this page tries again every " + Math.round(ms / 1000) + " s." + old
          : e && e.status === 429 ? "The hub server is busy and asked this page to wait. Reading again in " + Math.round(ms / 1000) + " s." + old
          : e && e.code === "network" ? "Cannot reach the hub server (" + msg + ")." + old + " Trying again."
          : e && e.status ? "The hub server refused the read (" + msg + ")." + old + " Trying again."
          : "This page could not show what the hub server sent (" + msg + ")." + old + " Trying again.");
        await nap(ms, stop.signal);
      }
    }
  }
  render();
  watch();
  machineWatch().catch(() => {});
})();
</script>
</body>
</html>
