<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Action Hub</title>
<style>
/* Layout: one hub column — summary strip, filter tabs, question cards stacked newest-open first.
   Nothing here is loaded from the network: the fonts named below are used only where the machine has them. */
[hidden]{display:none !important}
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#17202a; --muted:#5b6876; --line:#d9dfe6;
  --accent:#1f5f8b; --accent-soft:#e3eef6; --rec:#8a5a00; --rec-soft:#fbf0d9;
  --ok:#2c7a4b; --ok-soft:#e2f2e8; --warn:#a33b2b; --warn-soft:#f9e3df;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --fg:#e4e9ef; --muted:#93a1b0; --line:#2b3642;
  --accent:#6fb0de; --accent-soft:#1c3346; --rec:#e9b55a; --rec-soft:#3a2d14;
  --ok:#6cc995; --ok-soft:#173527; --warn:#ef8a7a; --warn-soft:#3d1d18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --fg:#e4e9ef; --muted:#93a1b0; --line:#2b3642;
  --accent:#6fb0de; --accent-soft:#1c3346; --rec:#e9b55a; --rec-soft:#3a2d14;
  --ok:#6cc995; --ok-soft:#173527; --warn:#ef8a7a; --warn-soft:#3d1d18; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:grid;gap:18px}
header{display:grid;gap:4px}
h1{font-size:1.6rem;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:62ch}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font:600 .85rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tab .n{font:600 .75rem var(--f-mono);font-variant-numeric:tabular-nums;opacity:.85}
.sw{gap:0;align-items:baseline}
.sw .tab{display:inline;border:0;border-radius:0;background:none;padding:2px 0;font-weight:500;color:var(--muted)}
.sw .tab[aria-selected="true"]{background:none;color:var(--fg);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.sw .tab .n{margin-left:5px}
.sw .tab+.tab::before{content:"\00b7";display:inline-block;margin:0 8px;color:var(--muted)}
.tab:focus-visible,button:focus-visible,textarea:focus-visible,label.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
select{font:500 .85rem var(--f-body);padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.list{display:grid;gap:14px}
.wrap>*,.list>*{min-width:0}
.usage{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.acct{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.acct h3{margin:0;font:600 1rem var(--f-body);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.meter{display:grid;gap:4px}
.meter .lab{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.meter .pct{font:600 .9rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.meter .track{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.meter .fill{height:100%;border-radius:999px;background:var(--accent)}
.meter.high .fill{background:var(--rec)} .meter.high .pct{color:var(--rec)}
.meter.crit .fill{background:var(--warn)} .meter.crit .pct{color:var(--warn)}
.acct .foot{font-size:.75rem;color:var(--muted)}
.acct .foot.stale{color:var(--rec)}
.bfil{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
.bfil .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bfil .lbl{font:600 .7rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:4.5em}
.fchip{font:500 .8rem var(--f-body);padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.fchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.fchip .c{opacity:.75;margin-left:4px}
.bfil input[type=search]{font:500 .85rem var(--f-body);padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%;max-width:28rem;box-sizing:border-box}
.period{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px;font-size:.85rem;color:var(--muted)}
.agt .pr{font:600 .8rem var(--f-mono);white-space:nowrap}
h3.blk{font:600 .78rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.unote{font-size:.8rem;color:var(--muted);margin:0 0 4px}
.agwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.agt{width:100%;border-collapse:collapse;font-size:.875rem}
.agt th{text-align:left;font:600 .72rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line)}
.agt td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.agt tr:last-child td{border-bottom:0}
.agt .nm{font:600 .875rem var(--f-mono);white-space:nowrap}
.agt .md{font:500 .8rem var(--f-mono);white-space:nowrap}
.agt .role{color:var(--muted);min-width:220px;overflow-wrap:anywhere}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.q.answered{border-left:4px solid var(--accent)}
.q.logged{border-left:4px solid var(--ok);opacity:.92}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.78rem;color:var(--muted)}
.id{font:600 .78rem var(--f-mono);color:var(--fg)}
.chip{font:600 .7rem var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.rec{background:var(--rec-soft);color:var(--rec)}
.q h2{font-size:1.08rem;margin:0;line-height:1.35;text-wrap:balance}
.ctx{margin:0;white-space:pre-wrap;color:var(--fg);max-width:68ch;overflow-wrap:anywhere}
.refs{font:.78rem var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
label.opt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;align-items:start}
label.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
label.opt input{margin-top:4px;accent-color:var(--accent)}
.ol{font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.od{grid-column:2;color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
textarea{width:100%;box-sizing:border-box;min-height:64px;font:inherit;font-size:.9rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);resize:vertical}
.act{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button.primary{font:600 .9rem var(--f-body);background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
button.link{font:500 .85rem var(--f-body);background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;text-decoration:underline}
button:disabled{opacity:.5;cursor:default}
.status{font-size:.82rem;color:var(--muted)}
.status.err{color:var(--warn)}
.ans{background:var(--bg);border-radius:8px;padding:10px 12px;display:grid;gap:4px;font-size:.9rem}
.ans b{font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;color:var(--muted)}
.sections{display:flex;flex-wrap:wrap;gap:0 4px;border-bottom:1px solid var(--line)}
@media (max-width:560px){.sec{padding:8px 8px 10px;font-size:.92rem}}
.sec{font:600 1rem var(--f-body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 12px 10px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.sec[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.sec .n{font:600 .75rem var(--f-mono);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 7px}
.sec:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.t{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;min-width:0}
.t.done{opacity:.72}
.t.done h2{text-decoration:line-through;text-decoration-color:var(--muted)}
.t > .body{display:grid;gap:8px;min-width:0}
.t h2{font-size:1rem;margin:0;line-height:1.4;text-wrap:balance}
.chk{width:22px;height:22px;margin-top:2px;accent-color:var(--ok);cursor:pointer}
.cmd{display:flex;gap:8px;align-items:stretch;min-width:0}
.cmd pre{margin:0;flex:1;min-width:0;overflow-x:auto;font:.8rem/1.5 var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;white-space:pre}
.copy{font:600 .78rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:6px;padding:0 10px;cursor:pointer}
form.add{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
form.add input[type=text]{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
form.add textarea{min-height:44px}
.chip.urgent{background:var(--warn-soft);color:var(--warn)}
.q.urgent:not(.logged),.t.urgent:not(.done){border-left:4px solid var(--warn)}
.sec .n.hot{background:var(--warn-soft);color:var(--warn)}
.urg{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);cursor:pointer}
.urg input{accent-color:var(--warn)}
.chip.need{background:var(--warn-soft);color:var(--warn)}
.flow{display:flex;flex-wrap:wrap;gap:4px;font:500 .74rem var(--f-mono);color:var(--muted)}
.flow span{padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.flow span.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.flow span.past{color:var(--fg)}
.links{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.story-to{margin:0;font:500 .85rem var(--f-body);color:var(--muted)}
.story-to strong{color:var(--fg)}
form.add select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
form.add textarea.story{min-height:110px}
.q.unread{border-left:4px solid var(--accent)}
.quote{margin:0;padding-left:10px;border-left:3px solid var(--line);color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch}
.reply{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch}
.gone{background:var(--rec-soft);color:var(--rec);border-radius:8px;padding:8px 12px;font-size:.85rem;margin:0;overflow-wrap:anywhere}
.pk h2{margin:0;font-size:1rem;line-height:1.4}
.pk-h{font:600 .78rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.pk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:grid;gap:6px;min-width:0}
.pk .age{font:600 .8rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.pk .age.old{color:var(--rec)}
.pk .br{font:.78rem var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.fchip[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pmf{display:grid;gap:8px;min-width:0}
.pmf .row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.pmbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.q.queued{border-left:4px solid var(--line)}
.q.sent{border-left:4px solid var(--accent)}
.q.done{border-left:4px solid var(--ok)}
button.danger{color:var(--warn)}
.empty strong{display:block;color:var(--fg);font-size:1rem;margin-bottom:4px}
@media (prefers-reduced-motion:no-preference){.q{transition:border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Action Hub</h1>
    <p class="sub">Questions from the PM and the coordinators, the PM's answers to what you ask, the steps only you can do, and your backlogs. Answer and tick off whenever you like; nothing waits on you.</p>
    <div class="status" id="pmseen" role="status"></div>
    <div class="status err" id="loaderr" role="alert" hidden></div>
  </header>

  <div class="sections" role="tablist" id="sections">
    <button class="sec" role="tab" data-s="questions" aria-selected="true" id="sec-questions">Inbox <span class="n" id="n-q">0</span></button>
    <button class="sec" role="tab" data-s="topm" aria-selected="false" id="sec-topm">To PM <span class="n" id="n-pm">0</span></button>
    <button class="sec" role="tab" data-s="todo" aria-selected="false" id="sec-todo">To do <span class="n" id="n-t">0</span></button>
    <button class="sec" role="tab" data-s="backlog" aria-selected="false" id="sec-backlog">Backlog <span class="n" id="n-s">0</span><span class="n hot" id="n-sp" hidden></span></button>
    <button class="sec" role="tab" data-s="info" aria-selected="false" id="sec-info">Info</button>
  </div>

  <div class="bar" id="qbar">
    <div class="tabs" role="tablist" id="qtabs" data-for="inbox">
      <button class="tab" role="tab" data-qt="questions" aria-selected="true" id="qtab-questions">Questions <span class="n" id="n-qq">0</span></button>
      <button class="tab" role="tab" data-qt="inbox" aria-selected="false" id="qtab-answers">Answers <span class="n" id="n-i">0</span></button>
    </div>
    <div class="tabs sw" role="tablist" id="tabs" data-for="questions" aria-label="Which questions">
      <button class="tab" role="tab" data-f="open" aria-selected="true" id="tab-open">Open <span class="n" id="n-open">0</span></button>
      <button class="tab" role="tab" data-f="answered" aria-selected="false" id="tab-answered">Submitted <span class="n" id="n-answered">0</span></button>
      <button class="tab" role="tab" data-f="logged" aria-selected="false" id="tab-logged">Logged <span class="n" id="n-logged">0</span></button>
      <button class="tab" role="tab" data-f="other" aria-selected="false" id="tab-other" hidden>Other <span class="n" id="n-other">0</span></button>
    </div>
    <div class="tabs sw" role="tablist" id="itabs" data-for="inbox" aria-label="Which answers" hidden>
      <button class="tab" role="tab" data-if="unread" aria-selected="true" id="itab-unread">Unread <span class="n" id="n-iunread">0</span></button>
      <button class="tab" role="tab" data-if="read" aria-selected="false" id="itab-read">Read <span class="n" id="n-iread">0</span></button>
    </div>
  </div>
  <div class="bar">
    <div class="tabs sw" role="tablist" id="ttabs" data-for="todo" hidden>
      <button class="tab" role="tab" data-tf="open" aria-selected="true" id="ttab-open">To do <span class="n" id="n-topen">0</span></button>
      <button class="tab" role="tab" data-tf="done" aria-selected="false" id="ttab-done">Done <span class="n" id="n-tdone">0</span></button>
    </div>
    <div class="tabs" role="tablist" id="stabs" data-for="backlog" hidden>
      <button class="tab" role="tab" data-sf="new" aria-selected="true" id="stab-new">New story <span class="n" id="n-sactive">0</span></button>
      <button class="tab" role="tab" data-sf="current" aria-selected="false" id="stab-current">Current backlog <span class="n" id="n-bcur">0</span></button>
      <button class="tab" role="tab" data-sf="parked" aria-selected="false" id="stab-parked">Parked <span class="n" id="n-p">0</span></button>
      <button class="tab" role="tab" data-sf="done" aria-selected="false" id="stab-done">Completed</button>
    </div>
    <div class="tabs" role="tablist" id="ftabs" data-for="info" hidden>
      <button class="tab" role="tab" data-nf="usage" aria-selected="true" id="ftab-usage">Usage <span class="n" id="n-u">–</span></button>
      <button class="tab" role="tab" data-nf="agents" aria-selected="false" id="ftab-agents">Agents <span class="n" id="n-a">0</span></button>
    </div>
    <div class="pmbar" id="pmtabs" hidden>
      <div class="tabs sw" role="tablist" data-for="topm">
        <button class="tab" role="tab" data-pf="queued" aria-selected="true" id="ptab-queued">Queued <span class="n" id="n-pqueued">0</span></button>
        <button class="tab" role="tab" data-pf="sent" aria-selected="false" id="ptab-sent">Sent <span class="n" id="n-psent">0</span></button>
        <button class="tab" role="tab" data-pf="done" aria-selected="false" id="ptab-done">Done <span class="n" id="n-pdone">0</span></button>
      </div>
      <button class="primary" type="button" id="pm-sendall" disabled>Send all</button><span class="status" id="pm-sendstatus" role="status"></span>
    </div>
    <select id="repo" aria-label="Filter by repository"><option value="">All repos</option></select>
    <select id="brepo" aria-label="Backlog" hidden><option value="">All backlogs</option></select>
  </div>

  <form class="add" id="addform" hidden>
    <input type="text" id="add-title" placeholder="Add your own item" aria-label="New to-do item" maxlength="200">
    <textarea id="add-detail" placeholder="Details (optional)" aria-label="Details"></textarea>
    <div class="act"><label class="urg" for="add-urgent"><input type="checkbox" id="add-urgent"> Urgent</label><button class="primary" type="submit" id="add-btn" disabled>Add</button><span class="status" id="add-status" role="status"></span></div>
  </form>

  <form class="add" id="pmform" hidden aria-label="Write to the PM">
    <div id="pm-fields"></div>
    <div class="act"><button class="primary" type="submit" id="pm-add" disabled>Add</button><span class="status" id="pm-addstatus" role="status"></span></div>
  </form>

  <form class="add" id="storyform" hidden>
    <p class="story-to" id="story-repo" aria-live="polite"></p>
    <input type="text" id="story-title" placeholder="Story title" aria-label="Story title" maxlength="200">
    <textarea class="story" id="story-text" placeholder="What you want and why. The coordinator reviews it and asks you here if anything is unclear." aria-label="Story"></textarea>
    <div class="act"><label class="urg" for="story-urgent"><input type="checkbox" id="story-urgent"> Urgent</label><button class="primary" type="submit" id="story-btn" disabled>Submit story</button><span class="status" id="story-status" role="status"></span></div>
  </form>

  <div class="list" id="list">
    <div class="empty"><strong>Loading questions…</strong>The PM posts each question here with its context, options and recommendation.</div>
  </div>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const state = { docs: [], inbox: [], ifilter: "unread", todos: [], stories: [], backlog: [], completed: [], period: 7, bprio: new Set(["1", "2", "3"]), bstat: new Set(["open", "blocked", "parked", "pulled"]), bq: "", usage: [], agents: [], parked: [], gone: {}, partial: {}, seen: null, repos: [], brepo: "", sfilter: "new", infotab: "usage", inboxtab: "questions", topm: [], pfilter: "queued", pmOlder: false, pmEdit: new Map(), todoEdit: new Map(), stale: {}, section: "questions", filter: "open", tfilter: "open", repo: "", editing: new Set() };
  if (location.hash === "#inbox") state.section = "inbox";
  if (location.hash === "#todo") state.section = "todo";
  if (location.hash === "#topm") state.section = "topm";
  if (location.hash === "#backlog" || location.hash === "#stories") state.section = "backlog";
  try { const it = localStorage.getItem("oq.infotab"); if (it === "usage" || it === "agents") state.infotab = it; } catch(e){}
  if (location.hash === "#info") state.section = "info";
  if (location.hash === "#usage" || location.hash === "#agents") { state.section = "info"; state.infotab = location.hash.slice(1); }
  if (location.hash === "#parked") { state.section = "backlog"; state.sfilter = "parked"; }
  // ready: the server has answered once, so the lists are real and the owner's controls are shown.
  let ready = false;

  // The one transport: every call the page makes to the hub server goes through this object, so another
  // transport (the same four methods) can replace it. The session cookie the pairing link set is the page's
  // only credential; the browser adds Origin to a write. A refusal is an Error with status, code, field and
  // retryAfter (seconds, when the server named one). A call that got no answer at all has status 0 and code

      btn.disabled = draft.choice == null || (draft.choice === "other" && !draft.note.trim());
      btn.addEventListener("click", async () => {
        btn.disabled = true; said.delete(d.id); unread.delete(d.id); status.className = "status"; status.textContent = "Sending…";
        try {
          // The choice is the option's place in the list, or "other" with a note; the server writes the label and the time.
          await hub.post("/questions/" + seg(d.id) + "/answer", { choice: draft.choice, note: (draft.note||"").trim(), ...pin(d) });
          // Sent. If the lists cannot be read again the card is still the question from before the answer:
          // it says the answer was sent and offers no second send (which the server would refuse).
          clearDraft(d.id); state.editing.delete(d.id); await refresh().catch(() => { sent.set(d.id, asIs(d)); }); render();
        } catch (e) {
          // The question changed meanwhile: the lists are read again, so the card is the question as it is now
          // (and names its new version on the next send), with the draft still in it. If they cannot be read,
          // the card is still the old question and its line says so, until a later read brings the new one.
          if (e.status === 409) { said.set(d.id, CHANGED); await refresh().catch(() => { unread.set(d.id, asIs(d)); said.set(d.id, CHANGED_UNREAD); }); render(); return; }
          status.className = "status err";
          status.textContent = "Not sent: " + why(e) + ". Your draft is kept; try again.";
          btn.disabled = false;
        }
      });
      const acts = el("div", {class:"act"}, btn, status);
      if (d.status === "answered") acts.append(el("button", {class:"link", type:"button", text:"Cancel", onclick: () => { state.editing.delete(d.id); clearDraft(d.id); said.delete(d.id); unread.delete(d.id); render(); }}));
      parts.push(fs, note, acts);
    } else if (sent.has(d.id)) {
      parts.push(el("p", {class:"gone", role:"status", text: SENT_UNREAD}));
    } else if (d.answer) {
      const a = d.answer;
      const pick = a.choice === "other" ? "Something else" : (a.label || opts[a.choice]?.label || "—");
      parts.push(el("div", {class:"ans"},
        el("div", {}, el("b", {text: "Your answer: "}), pick, a.choice === rec ? " (the recommendation)" : ""),
        a.note ? el("div", {text: a.note}) : null,
        el("div", {class:"status", text: (a.at ? "Submitted " + when(a.at) : "") + (d.status === "logged" ? " · logged" : " · waiting for the PM to log it")})
      ));
      if (d.status === "answered") parts.push(el("div", {class:"act"}, el("button", {class:"link", type:"button", text:"Change answer", onclick: () => { state.editing.add(d.id); render(); }})));
    }
    return el("article", {class: "q " + d.status + (d.urgent ? " urgent" : ""), id: "q-" + d.id}, ...parts);
  }

  $("#tabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    state.filter = t.dataset.f; try { localStorage.setItem("oq.filter", state.filter); } catch(e){}
    render();
  });
  $("#sections").addEventListener("click", e => {
    const b = e.target.closest(".sec"); if (!b) return;
    state.section = b.dataset.s === "questions" && (state.section === "questions" || state.section === "inbox") ? state.section : b.dataset.s === "questions" ? state.inboxtab : b.dataset.s;
    try { localStorage.setItem("oq.section", state.section); } catch(e){}
    render();
  });
  $("#qtabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    state.section = state.inboxtab = t.dataset.qt; try { localStorage.setItem("oq.section", state.section); } catch(err){}
    render();
  });
  $("#ftabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    state.infotab = t.dataset.nf; try { localStorage.setItem("oq.infotab", state.infotab); } catch(err){}
    render();
  });
  $("#itabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    state.ifilter = t.dataset.if; render();
  });
  $("#ttabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    state.tfilter = t.dataset.tf; render();
  });
  const addT = $("#add-title"), addD = $("#add-detail"), addB = $("#add-btn"), addS = $("#add-status");
  addT.addEventListener("input", () => { addB.disabled = !addT.value.trim(); });
  $("#addform").addEventListener("submit", async e => {
    e.preventDefault();
    const title = addT.value.trim(); if (!title) return;
    addB.disabled = true; addS.className = "status"; addS.textContent = "Adding…";
    try {
      await write("/todos", { title, detail: addD.value.trim(), urgent: $("#add-urgent").checked });      // the server writes from, status and the time
      addT.value = ""; addD.value = ""; $("#add-urgent").checked = false; addS.textContent = "Added";
    } catch (err) {
      addS.className = "status err"; addS.textContent = "Not added: " + why(err) + ". Try again."; addB.disabled = false;
    }
  });
  $("#stabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    state.sfilter = t.dataset.sf; try { localStorage.setItem("oq.sfilter", state.sfilter); } catch(err){}
    render();
  });
  function storyTo(){
    const r = state.brepo;
    $("#story-repo").replaceChildren(...(r ? ["Adding to the ", el("strong", {text: r}), " backlog"] : ["Pick a backlog at the top to add a story."]));
    $("#story-btn").disabled = !(r && $("#story-title").value.trim() && $("#story-text").value.trim());
  }
  $("#brepo").addEventListener("change", e => { state.brepo = e.target.value; try { localStorage.setItem("oq.brepo", state.brepo); } catch(err){} render(); });
  const sR = {get value(){ return state.brepo; }}, sT = $("#story-title"), sX = $("#story-text"), sB = $("#story-btn"), sS = $("#story-status");
  try { const d = JSON.parse(localStorage.getItem("oq.story") || "null"); if (d) { sT.value = d.t || ""; sX.value = d.x || ""; } } catch(e){}
  // The server takes a story only with a repository, a title and its text.
  const sCheck = () => { sB.disabled = !(sR.value && sT.value.trim() && sX.value.trim()); try { localStorage.setItem("oq.story", JSON.stringify({t: sT.value, x: sX.value})); } catch(e){} };
  sCheck();
  [sT, sX].forEach(n => n.addEventListener("input", sCheck));
  $("#storyform").addEventListener("submit", async e => {
    e.preventDefault();
    const title = sT.value.trim(), story = sX.value.trim(); if (!title || !story || !sR.value) return;
    sB.disabled = true; sS.className = "status"; sS.textContent = "Submitting…";
    try {
      await hub.post("/stories", { repo: sR.value, title, story, urgent: $("#story-urgent").checked });
      sT.value = ""; sX.value = ""; $("#story-urgent").checked = false; sCheck(); sS.textContent = "Submitted. The PM hands it to the coordinator.";
      await refresh().catch(() => {});
    } catch (err) {
      sS.className = "status err"; sS.textContent = "Not submitted: " + why(err) + ". Your draft is kept."; sB.disabled = false;
    }
  });
  $("#repo").addEventListener("change", e => { state.repo = e.target.value; render(); });

  // Loading. One snapshot fills every list. Then one long-poll at a time waits for the next change and the
  // snapshot is read again. A failure is said at the top, in its own words: an unpaired browser stops reading
  // (no later try can succeed until the owner pairs it again), a busy server is given the wait it asked for,
  // and anything else is tried again after hubRetryMs.
  let rev = 0, lastKey = "", fails = 0;
  function loadSay(text){ const b = $("#loaderr"); b.textContent = text; b.hidden = !text; }
  const typing = () => { const a = document.activeElement; return !!a && a !== document.body && a.matches("input:not([type=checkbox]):not([type=radio]), textarea"); };
  async function refresh(){
    const next = hubState(await hub.snapshot());
    if (ready && next.revision < rev) return;         // an older answer that arrived late
    rev = next.revision;
    const first = !ready; ready = true;
    for (const k of ["docs", "inbox", "todos", "stories", "topm", "repos", "backlog", "completed", "parked", "usage", "agents", "gone", "partial", "stale", "seen"]) state[k] = next[k];
    // An edit outlasts its item: one that is gone, or no longer the owner's to edit, keeps its card (loseEdit).
    for (const id of [...state.pmEdit.keys()]) if (!state.topm.some(x => x.id === id && x.status === "queued")) loseEdit(state.pmEdit, id);
    for (const id of [...state.todoEdit.keys()]) if (!state.todos.some(t => t.id === id && t.from === "you")) loseEdit(state.todoEdit, id);
    // What the lists show, without what moves on every read (the revision, and the time of each read or fetch
    // of a backlog or of the usage): when only those moved and the owner is typing, the lists are left alone.
    const untimed = rows => rows.map(r => ({ ...r, posted_at: null }));
    const unsince = Object.fromEntries(Object.entries(next.stale).map(([v, rows]) => [v, rows.map(o => ({ ...o, since: null }))]));
    const key = JSON.stringify({ ...next, revision: 0, seen: null, stale: unsince, usage: next.usage.map(u => ({ ...u, measured_at: null })), backlog: untimed(next.backlog), completed: untimed(next.completed), parked: untimed(next.parked) });
    const same = key === lastKey; lastKey = key;
    if (first || !same || !typing()) render(); else seenLine();
  }
  const sleep = ms => new Promise(done => setTimeout(done, ms));
  async function watch(){
    // After a failure the lists are read again before waiting: what was missed is shown, and the notice at
    // the top goes as soon as the server answers, not when the next change comes.
    let again = true;
    for (;;) {
      try {
        if (again) { await refresh(); again = false; loadSay(""); }    // fails is kept: only a wait that answers ends the run of failures
        const w = await hub.wait(rev);
        if (w.reset) rev = 0;                           // the server's history does not reach back to rev: take whatever it holds now
        await refresh();
        fails = 0; loadSay("");
      } catch (e) {
        const old = ready ? " The lists may be out of date." : "";
        if (e && e.unpaired) { loadSay("This browser is no longer paired with the hub. Run `hub open` on the PC to pair it again. This page has stopped reading the hub server." + old); return; }
        fails++; again = true;
        const ms = hubRetryMs(fails, e && e.retryAfter), msg = (e && e.message) || "no reason given";
        loadSay(e && e.status === 429 ? "The hub server is busy and asked this page to wait. Reading again in " + Math.round(ms / 1000) + " s." + old
          : e && e.code === "network" ? "Cannot reach the hub server (" + msg + ")." + old + " Trying again."
          : e && e.status ? "The hub server refused the read (" + msg + ")." + old + " Trying again."
          : "This page could not show what the hub server sent (" + msg + ")." + old + " Trying again.");
        await sleep(ms);
      }
    }
  }
  render();
  watch();
})();
</script>
