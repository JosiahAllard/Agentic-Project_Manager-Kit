description = "Art that is code - shaders, materials, palettes and UI themes, procedural meshes and textures, lighting and post-processing - built against a written art direction and checked by rendering a frame and looking at it. It cannot model or animate by hand; it makes images with the owner's local generators (logging what works in the shared asset-generation knowledge base), stopping and reporting if they are down; anything else needing a drawn or modelled asset stops and says what asset is needed. Must be given the art direction or section it implements, the scenes and resources it owns, and (for any render) a lock and port. Repository specifics come from `.codex/agent-profile.md`."
model_reasoning_effort = "high"
